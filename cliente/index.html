<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"
        integrity="sha512-3j3VU6WC5rPQB4Ld1jnLV7Kd5xr+cq9avvhwqzbH/taCRNURoeEpoPBK9pDyeukwSxwRPJ8fDgvYXd6SkaZ2TA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/cliente/clienteRest.js"></script>
    <script src="/cliente/controlWeb.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }


        .container {
            background: transparent;
            border-radius: 0;
            box-shadow: none;
            padding: 0;
            margin-top: 0;
            margin-bottom: 0;
            max-width: 100%;
        }

        /* Estilos especiales para cuando se muestra el formulario de login/registro */
        .container.auth-container-wrapper {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 40px;
            margin-top: 30px;
            margin-bottom: 30px;
            max-width: 1200px;
        }

        #registro {
            width: 100%;
        }

        #msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 600px;
        }

        #msg.center-message {
            top: 50%;
            transform: translate(-50%, -50%);
            width: auto;
            max-width: none;
        }

        #msg>div {
            pointer-events: auto;
        }

        /* Preloader Mejorado */
        #app-preloader {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #3b82f6 0%, #172554 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #app-preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .preloader-content {
            text-align: center;
        }

        .preloader-logo {
            font-size: 48px;
            font-weight: 800;
            color: white;
            margin-bottom: 24px;
            animation: fadeInDown 0.6s ease;
        }

        .preloader-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid white;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        .preloader-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: 500;
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>

</head>

<body>

    <!-- Preloader -->
    <div id="app-preloader">
        <div class="preloader-content">
            <div class="preloader-logo">
                <i class="fas fa-comments"></i> esiiChat
            </div>
            <div class="preloader-spinner"></div>
            <div class="preloader-text">Cargando...</div>
        </div>
    </div>

    <div id="msg"></div>


    <div class="container" id="mainContainer">
        <div id="au"></div>
        <div id="registro" style="display: flex; justify-content: center; align-items: center;"></div>
    </div>

    <!-- Modal de Verificación de Correo -->
    <div class="modal fade" id="modalVerificacion" tabindex="-1" role="dialog" aria-labelledby="modalVerificacionLabel"
        aria-hidden="true" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content" style="border: none; border-radius: 15px; overflow: hidden;">
                <div class="modal-header text-white"
                    style="background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); border: none;">
                    <h5 class="modal-title" id="modalVerificacionLabel" style="font-weight: 600;">
                        <i class="fas fa-check-circle mr-2"></i>¡Registro Exitoso!
                    </h5>
                </div>
                <div class="modal-body text-center py-5">
                    <div class="mb-4">
                        <div
                            style="width: 80px; height: 80px; background: rgba(59, 130, 246, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                            <i class="fas fa-envelope-open-text fa-3x" style="color: #3b82f6;"></i>
                        </div>
                    </div>
                    <h4 style="color: #1e293b; font-weight: 700;">Verifica tu correo</h4>
                    <p class="mt-3 text-muted" style="font-size: 1.1rem;">
                        Hemos enviado un enlace de confirmación a:
                    </p>
                    <div class="p-3 mb-3 bg-light rounded shadow-sm d-inline-block">
                        <strong><span id="verificacionEmail" style="color: #2563eb; font-size: 1.1rem;"></span></strong>
                    </div>
                    <p class="text-muted small mt-2">
                        Por favor, revisa tu bandeja de entrada (y spam).<br>
                        Debes confirmar tu cuenta antes de poder iniciar sesión.
                    </p>
                </div>
                <div class="modal-footer justify-content-center pb-4" style="border-top: none;">
                    <button type="button" class="btn px-5 py-2 shadow-sm" id="btnIrLogin"
                        style="background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; border-radius: 25px; font-weight: 600; transition: all 0.3s ease;">
                        Entendido, ir al Login
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Global de Mensajes (Reemplaza a los toasts) -->
    <div class="modal fade" id="modalMensajeGlobal" tabindex="-1" role="dialog"
        aria-labelledby="modalMensajeGlobalLabel" aria-hidden="true" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content" style="border: none; border-radius: 15px; overflow: hidden;">
                <div class="modal-header text-white" id="modalGlobalHeader"
                    style="border: none; transition: background 0.3s ease;">
                    <h5 class="modal-title" id="modalMensajeGlobalLabel" style="font-weight: 600;">
                        <!-- Icono y Título dinámicos -->
                    </h5>
                </div>
                <div class="modal-body text-center py-5">
                    <div class="mb-4">
                        <div id="modalGlobalIconBg"
                            style="width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; transition: all 0.3s ease;">
                            <i id="modalGlobalIcon" class="fas fa-3x" style="transition: color 0.3s ease;"></i>
                        </div>
                    </div>
                    <h4 id="modalGlobalTitle" style="color: #1e293b; font-weight: 700;"></h4>
                    <p id="modalGlobalBody" class="mt-3 text-muted" style="font-size: 1.1rem; padding: 0 20px;">
                        <!-- Mensaje dinámico -->
                    </p>
                </div>
                <div class="modal-footer justify-content-center pb-4" style="border-top: none;">
                    <button type="button" class="btn px-5 py-2 shadow-sm" data-dismiss="modal" id="btnCerrarModalGlobal"
                        style="color: white; border: none; border-radius: 25px; font-weight: 600; transition: all 0.3s ease;">
                        Entendido
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script defer>
        cw = new ControlWeb();
        rest = new ClienteRest(cw);
        cw.comprobarSesion();

        // Detectar si el servidor pide mostrar el modal de completar registro con Google
        $(document).ready(function () {
            const urlParams = new URLSearchParams(window.location.search);

            // El servidor redirige a /?view=login&modal=google_complete_registration&email=...
            // cuando el usuario NO existe en la base de datos
            if (urlParams.get('modal') === 'google_complete_registration') {
                const email = urlParams.get('email');

                console.log('📝 Usuario nuevo de Google detectado desde URL');
                console.log('📧 Email:', email);
                console.log('⏳ Esperando a que el modal esté disponible en el DOM...');

                // Usar un intervalo para esperar a que ControlWeb cargue el login.html en el DOM
                const checkExist = setInterval(function () {
                    // Buscar el modal específico que está dentro de login.html
                    if ($('#modalPasswordGoogle').length) {
                        console.log('✅ Modal encontrado en el DOM');

                        // Mostrar el modal
                        $('#modalPasswordGoogle').modal('show');

                        // Rellenar email visualmente
                        if (email && $('#googleEmail').length) {
                            $('#googleEmail').text(email);
                            console.log('📧 Email establecido en el modal:', email);
                        }

                        clearInterval(checkExist);

                        console.log('🎯 Modal de completar registro mostrado correctamente');

                        // Limpiar la URL
                        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?view=login';
                        window.history.replaceState({ path: newUrl }, '', newUrl);
                    }
                }, 100);

                // Timeout de seguridad - si después de 5 segundos no aparece el modal
                setTimeout(function () {
                    if ($('#modalPasswordGoogle').length === 0) {
                        console.error('❌ Modal no apareció después de 5 segundos');
                        console.error('⚠️ Asegúrate de que login.html contiene el modal #modalPasswordGoogle');
                    }
                }, 5000);
            }
        });
    </script>
    <script>
        // Ocultar preloader cuando la página esté lista
        $(window).on('load', function () {
            setTimeout(function () {
                $('#app-preloader').addClass('hidden');
            }, 500);
        });

        // Fallback: ocultar después de 3 segundos máximo
        setTimeout(function () {
            $('#app-preloader').addClass('hidden');
        }, 3000);
    </script>
</body>

</html>
